[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "papertracker"
version = "0.1.0"
description = "Tracks whether minting Papertrade PAPER is paying for itself"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["papertracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
